<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CV-maker</title>

    <!-- Lettertypes (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Serif+4:wght@400;600&display=swap">

    <!-- Bibliotheek die van het CV een PDF maakt -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        /* ==========================================================
           INHOUD
           1. Variabelen (kleuren van de app)
           2. Basis
           3. Indeling van de app
           4. Formulier links
           5. Voorbeeld rechts
           6. CV: gedeelde stijlen
           7. CV: ontwerp "zijbalk"
           8. CV: ontwerp "klassiek"
           9. Kleine schermen
           10. Printen
           ========================================================== */


        /* ---------- 1. Variabelen ---------- */
        :root {
            --accent: #1f3a5f;
            /* CV-kleur, wordt door de kleurkiezer aangepast */

            --ui-bg: #e8ebf0;
            /* achtergrond van de app */
            --ui-panel: #ffffff;
            /* achtergrond van het formulier */
            --ui-ink: #1c2330;
            /* tekstkleur */
            --ui-mute: #667085;
            /* grijze tekst */
            --ui-line: #d8dde5;
            /* randen */
            --ui-button: #1f3a5f;
            /* hoofdknop */
        }


        /* ---------- 2. Basis ---------- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            font-size: 14px;
            color: var(--ui-ink);
            background: var(--ui-bg);
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }


        /* ---------- 3. Indeling van de app ---------- */
        .app {
            display: grid;
            grid-template-columns: minmax(320px, 420px) 1fr;
            /* formulier | voorbeeld */
            height: 100%;
        }


        /* ---------- 4. Formulier links ---------- */
        .editor {
            padding: 20px 20px 40px;
            overflow-y: auto;
            background: var(--ui-panel);
            border-right: 1px solid var(--ui-line);
        }

        .editor h1 {
            margin: 0 0 4px;
            font-size: 20px;
        }

        .editor .lead {
            margin: 0 0 18px;
            line-height: 1.5;
            color: var(--ui-mute);
        }

        /* Knoppen bovenaan */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 16px;
            font-weight: 700;
            color: #fff;
            background: var(--ui-button);
            border: 0;
            border-radius: 8px;
        }

        .btn:hover {
            filter: brightness(1.15);
        }

        .btn[disabled] {
            opacity: 0.6;
            cursor: wait;
        }

        .btn.ghost {
            font-weight: 500;
            color: var(--ui-ink);
            background: transparent;
            border: 1px solid var(--ui-line);
        }

        .btn.ghost:hover {
            background: #f3f5f8;
            filter: none;
        }

        /* Inklapbare onderdelen (Opmaak, Persoonlijk, ...) */
        details.section {
            padding: 4px 0;
            border-top: 1px solid var(--ui-line);
        }

        details.section>summary {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            list-style: none;
        }

        details.section>summary::-webkit-details-marker {
            display: none;
        }

        details.section>summary::after {
            content: '+';
            font-size: 18px;
            font-weight: 400;
            line-height: 1;
            color: var(--ui-mute);
        }

        details.section[open]>summary::after {
            content: '−';
        }

        /* Invoervelden */
        .field {
            display: block;
            margin-bottom: 10px;
        }

        .field>span {
            display: block;
            margin-bottom: 3px;
            font-size: 12px;
            color: var(--ui-mute);
        }

        .field input[type="text"],
        .field input[type="email"],
        .field input[type="tel"],
        .field textarea,
        .field select {
            width: 100%;
            padding: 8px 10px;
            font: inherit;
            color: var(--ui-ink);
            background: #fff;
            border: 1px solid var(--ui-line);
            border-radius: 6px;
        }

        .field textarea {
            min-height: 70px;
            line-height: 1.45;
            resize: vertical;
        }

        .field.checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .field.checkbox>span {
            margin: 0;
            font-size: 14px;
            color: var(--ui-ink);
        }

        .row-two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* Een functie of opleiding in het formulier */
        .item {
            padding: 12px;
            margin-bottom: 10px;
            background: #fafbfc;
            border: 1px solid var(--ui-line);
            border-radius: 8px;
        }

        .item-tools {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-bottom: 8px;
        }

        .mini {
            padding: 3px 9px;
            font-size: 12px;
            color: var(--ui-mute);
            background: #fff;
            border: 1px solid var(--ui-line);
            border-radius: 6px;
        }

        .mini:hover {
            background: #f0f2f5;
        }

        .mini.danger:hover {
            color: #b42318;
            border-color: #b42318;
        }

        .add-button {
            width: 100%;
            padding: 9px;
            color: var(--ui-mute);
            background: transparent;
            border: 1.5px dashed var(--ui-line);
            border-radius: 8px;
        }

        .add-button:hover {
            color: var(--ui-button);
            border-color: var(--ui-button);
        }

        /* Kleurkiezer */
        .swatches {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .swatch {
            width: 28px;
            height: 28px;
            padding: 0;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 1px var(--ui-line);
        }

        .swatch.selected {
            box-shadow: 0 0 0 2px var(--ui-ink);
        }

        input[type="color"] {
            width: 32px;
            height: 32px;
            padding: 0;
            background: none;
            border: 0;
            cursor: pointer;
        }

        /* Foto */
        .photo-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .photo-row img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            background: #eee;
            border-radius: 50%;
        }


        /* ---------- 5. Voorbeeld rechts ---------- */
        .preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
            overflow: auto;
        }

        .preview-info {
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--ui-mute);
        }

        /* Wit vel met schaduw. Breedte en hoogte worden door de code ingesteld. */
        .paper {
            position: relative;
            background: #fff;
            box-shadow: 0 6px 30px rgba(20, 30, 50, 0.18);
        }

        /* Het CV wordt hierin verkleind zodat het in het scherm past */
        .scaler {
            width: 210mm;
            transform-origin: top left;
        }

        /* Rode lijnen op de plek waar een nieuwe pagina begint */
        .page-guides {
            position: absolute;
            inset: 0;
            width: 210mm;
            pointer-events: none;
            transform-origin: top left;
            background: repeating-linear-gradient(to bottom,
                    transparent 0,
                    transparent calc(297mm - 2px),
                    rgba(220, 38, 38, 0.55) calc(297mm - 2px),
                    rgba(220, 38, 38, 0.55) 297mm);
        }


        /* ---------- 6. CV: gedeelde stijlen ----------
           Pas hier de lettergroottes aan. Ze schalen automatisch mee
           wanneer het CV op één pagina wordt verkleind (--text-scale). */
        .cv {
            --text-scale: 1;
            --size-base: calc(10pt * var(--text-scale));
            --size-name: calc(27pt * var(--text-scale));
            --size-role: calc(12pt * var(--text-scale));
            --size-heading: calc(12.5pt * var(--text-scale));
            --size-side-heading: calc(11pt * var(--text-scale));
            --size-job-title: calc(10.5pt * var(--text-scale));
            --size-detail: calc(9.5pt * var(--text-scale));
            --size-small: calc(9pt * var(--text-scale));
            --size-label: calc(8pt * var(--text-scale));

            width: 210mm;
            /* A4 breed */
            min-height: 297mm;
            /* A4 hoog */
            font-size: var(--size-base);
            line-height: 1.45;
            color: #222;
            background: #fff;
        }

        /* Lettertype-keuze */
        .cv.font-sans {
            --heading-font: 'DM Sans', Arial, sans-serif;
            font-family: 'DM Sans', Arial, sans-serif;
        }

        .cv.font-serif {
            --heading-font: 'Fraunces', Georgia, serif;
            font-family: 'Source Serif 4', Georgia, serif;
            line-height: 1.5;
        }

        .cv h1,
        .cv h2,
        .cv h3,
        .cv p,
        .cv ul {
            margin: 0;
        }

        .cv ul {
            padding: 0;
            list-style: none;
        }

        .cv .name {
            font-family: var(--heading-font);
            font-size: var(--size-name);
            font-weight: 600;
            line-height: 1.1;
        }

        .cv .role {
            margin-top: 4px;
            font-size: var(--size-role);
        }

        /* Functie of opleiding */
        .cv .job,
        .cv .edu {
            margin-bottom: 11px;
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .cv .job-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
        }

        .cv .job-title {
            font-size: var(--size-job-title);
            font-weight: 700;
        }

        .cv .job-company {
            font-size: var(--size-detail);
        }

        .cv .period {
            font-size: var(--size-small);
            white-space: nowrap;
        }

        /* Opsomming met bolletjes */
        .cv .bullets {
            margin-top: 4px;
        }

        .cv .bullets li {
            position: relative;
            padding-left: 12px;
            margin-bottom: 2px;
        }

        .cv .bullets li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0.62em;
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
        }


        /* ---------- 7. CV: ontwerp "zijbalk" ---------- */
        .design-side {
            display: grid;
            grid-template-columns: 68mm 1fr;
            /* zijbalk | hoofdgedeelte */
        }

        .design-side aside {
            padding: 14mm 8mm;
            color: #fff;
            background: var(--accent);
        }

        .design-side main {
            padding: 14mm 12mm 12mm;
        }

        .design-side .photo {
            display: block;
            width: 38mm;
            height: 38mm;
            margin: 0 auto 8mm;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
        }

        /* Zijbalk */
        .design-side aside section {
            margin-bottom: 8mm;
        }

        .design-side aside h2 {
            padding-bottom: 4px;
            margin: 0 0 6px;
            font-family: var(--heading-font);
            font-size: var(--size-side-heading);
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        }

        .design-side aside li {
            margin-bottom: 5px;
            font-size: var(--size-detail);
            word-break: break-word;
        }

        .design-side aside .label {
            display: block;
            font-size: var(--size-label);
            opacity: 0.7;
        }

        /* Hoofdgedeelte */
        .design-side .head {
            margin-bottom: 8mm;
        }

        .design-side .role {
            color: var(--accent);
        }

        .design-side main section {
            margin-bottom: 7mm;
        }

        .design-side main h2 {
            padding-bottom: 3px;
            margin: 0 0 8px;
            font-family: var(--heading-font);
            font-size: var(--size-heading);
            font-weight: 600;
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
        }

        .design-side .period,
        .design-side .job-company {
            color: #555;
        }


        /* ---------- 8. CV: ontwerp "klassiek" ---------- */
        .design-classic {
            padding: 16mm 18mm;
        }

        .design-classic .head {
            display: flex;
            align-items: center;
            gap: 7mm;
            padding-bottom: 6mm;
            margin-bottom: 7mm;
            border-bottom: 3px solid var(--accent);
        }

        .design-classic .photo {
            width: 30mm;
            height: 30mm;
            object-fit: cover;
            border-radius: 50%;
        }

        .design-classic .role {
            color: var(--accent);
        }

        .design-classic .contact {
            display: flex;
            flex-wrap: wrap;
            gap: 3px 14px;
            margin-top: 8px;
            font-size: var(--size-detail);
            color: #444;
        }

        .design-classic section {
            margin-bottom: 7mm;
        }

        .design-classic h2 {
            padding-bottom: 3px;
            margin: 0 0 7px;
            font-family: var(--heading-font);
            font-size: var(--size-heading);
            font-weight: 600;
            color: var(--accent);
            border-bottom: 1px solid #ccd;
        }

        .design-classic .period,
        .design-classic .job-company {
            color: #555;
        }

        .design-classic .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .design-classic .chips li {
            padding: 1px 10px;
            font-size: var(--size-small);
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 99px;
        }

        .design-classic .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10mm;
        }


        /* ---------- 9. Kleine schermen ---------- */
        @media (max-width: 900px) {

            html,
            body {
                height: auto;
            }

            .app {
                grid-template-columns: 1fr;
                height: auto;
            }

            .editor {
                border-right: 0;
                border-bottom: 1px solid var(--ui-line);
            }
        }


        /* ---------- 10. Printen ---------- */
        @page {
            size: A4;
            margin: 0;
        }

        @media print {

            html,
            body {
                height: auto;
                background: #fff;
            }

            .editor,
            .preview-info,
            .page-guides {
                display: none !important;
            }

            .app {
                display: block;
            }

            .preview {
                display: block;
                padding: 0;
                overflow: visible;
            }

            .paper {
                width: auto !important;
                height: auto !important;
                box-shadow: none;
            }

            .scaler {
                transform: none !important;
            }

            /* Kleuren ook echt printen */
            * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            /* "Alles op één pagina": kap af zodat er geen lege tweede pagina komt */
            .cv.one-page {
                height: 296mm;
                min-height: 0;
                overflow: hidden;
            }
        }
    </style>
</head>


<body>
    <div class="app">

        <!-- Links: formulier -->
        <div class="editor" id="editor">
            <h1>CV-maker</h1>
            <p class="lead">
                Vul je gegevens in en zie het resultaat direct rechts.
                Je invoer wordt automatisch bewaard in je browser.
            </p>

            <div class="actions">
                <button class="btn" id="btn-download">Download als PDF</button>
                <button class="btn ghost" id="btn-print"
                    title="Opent het printvenster; kies daar 'Opslaan als PDF'. De tekst blijft selecteerbaar.">
                    Print / selecteerbare PDF
                </button>
                <button class="btn ghost" id="btn-open"
                    title="Open een PDF die je met deze CV-maker hebt gemaakt, of een back-up (.json), en ga verder waar je was.">
                    Gegevens openen (PDF of .json)
                </button>
                <button class="btn ghost" id="btn-backup">Back-up opslaan (.json)</button>
                <button class="btn ghost" id="btn-reset">Voorbeeld terugzetten</button>
                <input type="file" id="file-open" accept=".pdf,.json,application/pdf,application/json" hidden>
            </div>

            <!-- Het formulier zelf wordt door renderForm() gevuld -->
            <div id="form"></div>
        </div>

        <!-- Rechts: voorbeeld van het CV -->
        <div class="preview" id="preview">
            <div class="preview-info" id="preview-info"></div>
            <div class="paper" id="paper">
                <div class="scaler" id="scaler">
                    <div class="cv" id="cv"></div>
                </div>
                <div class="page-guides" id="page-guides"></div>
            </div>
        </div>

    </div>


    <script>
        /* ==========================================================
           INHOUD
           1. Instellingen
           2. Voorbeeldgegevens
           3. Gegevens en opslag
           4. Hulpfuncties
           5. Formulier (links)
           6. CV opbouwen
           7. Voorbeeld tonen (rechts)
           8. Foto
           9. Gegevens bewaren in PDF, openen en back-up
           10. PDF downloaden
           11. Knoppen en invoer koppelen
           12. Starten
           ========================================================== */


        /* ---------- 1. Instellingen ---------- */

        // Let op: verander deze twee niet, anders herkent de app oude opslag en oude PDF's niet meer.
        const STORAGE_KEY = 'cv-maker-v1';
        const PDF_DATA_MARKER = 'CVDATA1:';

        // Kleuren in de kleurkiezer (donker genoeg voor witte tekst in de zijbalk)
        const ACCENT_COLORS = ['#1f3a5f', '#0f5c5c', '#7a2e3b', '#3d5a40', '#5b3f8c', '#2b2b2b'];

        const A4_HEIGHT_PX = 297 / 25.4 * 96;   // hoogte van een A4 in pixels
        const MIN_TEXT_SCALE = 0.7;             // tekst wordt nooit kleiner dan 70%
        const TEXT_SCALE_STEP = 0.02;           // zoveel wordt de tekst per stap verkleind
        const PHOTO_SIZE_PX = 10000;             // foto's worden zo groot (vierkant) opgeslagen
        const PDF_ONE_PAGE_HEIGHT_PX = 1121;    // net iets minder dan A4, voorkomt een lege 2e pagina

        // Lege invulling voor een nieuwe functie of opleiding
        const NEW_ITEM = {
            jobs: { role: '', company: '', period: '', desc: '' },
            internships: { role: '', company: '', period: '', desc: '' },
            edus: { name: '', school: '', period: '' },
        };


        /* ---------- 2. Voorbeeldgegevens ----------
           Dit ziet iemand die de app voor het eerst opent. */
        const SAMPLE_DATA = {
            name: 'Jan Smit',
            title: 'Functietitel',
            email: 'jan.smit@voorbeeld.nl',
            phone: '06 12 34 56 78',
            city: 'Woonplaats',
            web: 'voorbeeld.nl',
            photo: '',

            summary: 'Hier komt een korte introductie over jezelf: wie je bent, waar je goed in bent en wat je zoekt. Houd het bij twee tot vier zinnen.',

            jobs: [
                {
                    role: 'Functie bij bedrijf',
                    company: 'Bedrijfsnaam, Plaats',
                    period: '2022 – heden',
                    desc: 'Beschrijf een taak of verantwoordelijkheid\nNoem een concreet resultaat\nVoeg nog een punt toe',
                },
                {
                    role: 'Eerdere functie',
                    company: 'Ander bedrijf, Plaats',
                    period: '2019 – 2022',
                    desc: 'Beschrijf wat je hier deed\nNoem iets waar je trots op bent',
                },
            ],

            internships: [
                {
                    role: 'Stage als [functie]',
                    company: 'Stagebedrijf, Plaats',
                    period: '2021',
                    desc: 'Beschrijf wat je tijdens je stage deed\nNoem iets wat je hebt geleerd',
                },
            ],

            edus: [
                { name: 'Naam van opleiding', school: 'Naam van school', period: '2016 – 2019' },
            ],

            skills: 'Vaardigheid 1, Vaardigheid 2, Vaardigheid 3, Vaardigheid 4',
            langs: 'Nederlands – moedertaal\nEngels – goed',

            // Opmaak
            template: 'side',       // 'side' (zijbalk) of 'classic' (klassiek)
            font: 'sans',           // 'sans' (schreefloos) of 'serif' (met schreef)
            color: '#1f3a5f',
            onePage: true,
        };


        /* ---------- 3. Gegevens en opslag ---------- */

        // Alles wat de gebruiker invult staat in dit ene object.
        let data = loadData();

        /**
         * Combineert opgeslagen gegevens met het voorbeeld, zodat ontbrekende velden worden aangevuld.
         * Oudere opslag of PDF's hebben nog geen "Stage": die laten we leeg in plaats van het voorbeeld te tonen.
         */
        function mergeWithSample(saved) {
            const merged = Object.assign(structuredClone(SAMPLE_DATA), saved);
            if (!Array.isArray(saved.internships)) merged.internships = [];
            return merged;
        }

        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    return mergeWithSample(JSON.parse(saved));
                }
            } catch (error) {
                // Opslag niet beschikbaar of kapot: begin met het voorbeeld.
            }
            return structuredClone(SAMPLE_DATA);
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (error) {
                // Opslag vol of uitgeschakeld: de app blijft gewoon werken.
            }
        }

        /** Sla op en ververs het voorbeeld. */
        function update() {
            saveData();
            renderCv();
        }

        /** Sla op en ververs zowel formulier als voorbeeld (bij toevoegen, verwijderen, kleurwissel...). */
        function updateAll() {
            saveData();
            renderForm();
            renderCv();
        }


        /* ---------- 4. Hulpfuncties ---------- */

        const $ = (selector) => document.querySelector(selector);

        const dom = {
            editor: $('#editor'),
            form: $('#form'),
            preview: $('#preview'),
            previewInfo: $('#preview-info'),
            paper: $('#paper'),
            scaler: $('#scaler'),
            guides: $('#page-guides'),
            cv: $('#cv'),
        };

        /** Maakt tekst veilig om in HTML te zetten. */
        function escapeHtml(text) {
            const replacements = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
            return String(text ?? '').replace(/[&<>"']/g, (char) => replacements[char]);
        }

        /** Splitst tekst op regels en laat lege regels weg. */
        function splitLines(text) {
            return String(text || '')
                .split('\n')
                .map((line) => line.trim())
                .filter(Boolean);
        }

        /** Hoeveel A4-pagina's past deze hoogte (in pixels) in? */
        function countPages(heightPx) {
            return Math.max(1, Math.ceil((heightPx - 2) / A4_HEIGHT_PX));
        }


        /* ---------- 5. Formulier (links) ---------- */

        // Kleine bouwstenen

        /* ---------- 6. CV opbouwen ---------- */

        function buildContactItems() {

        /** Bouwt de lijst met functies; gebruikt voor zowel Werkervaring als Stage. */

        /** Een sectie met kop, of niets als er geen inhoud is. */

        /** Ontwerp met gekleurde zijbalk. */
        function buildSideDesign(parts) {
            const { contact, skills, langs, photoHtml, nameHtml, summaryHtml } = parts;

            const contactHtml = `<ul>${contact.map((item) =>

        /** Ontwerp met één kolom. */
        function buildClassicDesign(parts) {

        /** Maakt de HTML van het hele CV, in het gekozen ontwerp. */
        function buildCv() {
            const parts = {
                contact: buildContactItems(),
                skills: buildSkillList(),
                langs: splitLines(data.langs),
                photoHtml: data.photo ? `<img class="photo" src="${data.photo}" alt="">` : '',
                nameHtml: `<h1 class="name">${escapeHtml(data.name)}</h1><p class="role">${escapeHtml(data.title)}</p>`,

        /* ---------- 7. Voorbeeld tonen (rechts) ---------- */

        let currentTextScale = 1;   // 1 = normaal, 0.9 = 90% enzovoort

        function renderCv() {
            const cv = dom.cv;

            const classes = ['cv', `design-${data.template}`, `font-${data.font}`];
            if (data.onePage) classes.push('one-page');
            cv.className = classes.join(' ');

            document.documentElement.style.setProperty('--accent', data.color);
            cv.innerHTML = buildCv();

            fitTextToOnePage();
            updatePreviewScale();
        }

        /** Bij "Alles op één pagina": tekst stapsgewijs verkleinen tot alles past. */
        function fitTextToOnePage() {
            const cv = dom.cv;
            let scale = 1;
            cv.style.setProperty('--text-scale', scale);

            if (data.onePage) {
                // Meet de echte inhoudshoogte, zonder de minimale A4-hoogte
                cv.style.minHeight = '0';
                cv.style.height = 'auto';

                while (cv.offsetHeight > A4_HEIGHT_PX - 2 && scale > MIN_TEXT_SCALE) {
                    scale = Math.round((scale - TEXT_SCALE_STEP) * 100) / 100;
                    cv.style.setProperty('--text-scale', scale);
                }

                cv.style.minHeight = '';
                cv.style.height = '';
            }

            currentTextScale = scale;
        }

        /** Verkleint het voorbeeld zodat het in het scherm past, en toont de paginagrenzen. */
        function updatePreviewScale() {
            const cvWidth = dom.cv.offsetWidth || 794;
            const cvHeight = dom.cv.offsetHeight;
            const scale = Math.min(1, (dom.preview.clientWidth - 48) / cvWidth);

            dom.scaler.style.transform = `scale(${scale})`;
            dom.guides.style.transform = `scale(${scale})`;
            dom.guides.style.height = `${cvHeight}px`;
            dom.paper.style.width = `${cvWidth * scale}px`;
            dom.paper.style.height = `${cvHeight * scale}px`;

            updatePreviewInfo(cvHeight);
        }

        function updatePreviewInfo(cvHeight) {
            const tooLong = data.onePage && cvHeight > A4_HEIGHT_PX + 1;
            if (tooLong) {
                dom.previewInfo.textContent =
                    'Dit past niet op één pagina, ook niet na verkleinen. Kort een tekst in of zet de optie "Alles op één pagina" uit.';
                return;
            }

            const pages = data.onePage ? 1 : countPages(cvHeight);
            const pageWord = pages === 1 ? 'pagina' : 'pagina\u2019s';
            const shrinkNote = currentTextScale < 1
                ? `, tekst verkleind tot ${Math.round(currentTextScale * 100)}%`
                : '';

            dom.previewInfo.textContent =
                `Voorbeeld op A4, ${pages} ${pageWord}${shrinkNote}. Rode lijnen tonen de paginagrens.`;
        }


        /* ---------- 8. Foto ---------- */

        /**
         * Snijdt een foto bij tot een vierkant (iets naar boven gericht, zodat gezichten in beeld blijven).
         * De PDF-maker kan geen niet-vierkante foto's netjes bijsnijden, daarom doen we dat zelf.
         * `done` krijgt de nieuwe foto en of die is veranderd.
         */
        function cropToSquare(source, done) {
            const image = new Image();
            image.onload = () => {
                const side = Math.min(image.width, image.height);
                const outputSize = Math.min(PHOTO_SIZE_PX, side);
                const offsetX = (image.width - side) / 2;
                const offsetY = (image.height - side) * 0.25;

                const canvas = document.createElement('canvas');
                canvas.width = canvas.height = outputSize;
                canvas.getContext('2d').drawImage(image, offsetX, offsetY, side, side, 0, 0, outputSize, outputSize);

                const wasChanged = image.width !== image.height;
                done(canvas.toDataURL('image/png'), wasChanged);
            };
            image.src = source;
        }

        /** Maakt een al opgeslagen foto vierkant als dat nog niet zo is. */
        function squareExistingPhoto() {
            if (!data.photo) return;
            cropToSquare(data.photo, (photo, wasChanged) => {
                if (wasChanged) {
                    data.photo = photo;
                    updateAll();
                }
            });
        }

        function handlePhotoUpload(file) {
            const reader = new FileReader();
            reader.onload = () => {
                cropToSquare(reader.result, (photo) => {
                    data.photo = photo;
                    updateAll();
                });
            };
            reader.readAsDataURL(file);
        }


        /* ---------- 9. Gegevens bewaren in PDF, openen en back-up ----------
           Bij het downloaden stoppen we je gegevens (als tekst) in de PDF zelf.
           Zo kun je een PDF later weer openen en verder werken. */

        function packData() {
            return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
        }

        function unpackData(text) {
            return JSON.parse(decodeURIComponent(escape(atob(text))));
        }

        /** Vervangt de huidige gegevens door ingelezen gegevens (na controle). */
        function applyImportedData(imported) {
            const looksValid = imported && typeof imported === 'object'
                && Array.isArray(imported.jobs) && Array.isArray(imported.edus);
            if (!looksValid) throw new Error('Ongeldige gegevens');

            data = mergeWithSample(imported);
            updateAll();
            squareExistingPhoto();
        }

        /** Zoekt de verborgen gegevens in een PDF-bestand. */
        async function readDataFromPdf(file) {
            const bytes = new Uint8Array(await file.arrayBuffer());

            // Bytes omzetten naar tekst, in blokken (anders loopt de browser vast bij grote bestanden)
            let text = '';
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                text += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }

            const match = text.match(new RegExp(PDF_DATA_MARKER + '([A-Za-z0-9+/=]+)'));
            if (!match) throw new Error('Geen gegevens in PDF');
            return unpackData(match[1]);
        }

        async function openDataFile(file) {
            try {
                const imported = /\.json$/i.test(file.name)
                    ? JSON.parse(await file.text())
                    : await readDataFromPdf(file);

                const confirmed = confirm('Je huidige invoer wordt vervangen door de gegevens uit dit bestand. Doorgaan?');
                if (confirmed) applyImportedData(imported);
            } catch (error) {
                alert('In dit bestand zitten geen CV-gegevens. Dit werkt alleen met een PDF die met de knop '
                    + '"Download als PDF" is gemaakt (in deze nieuwe versie), of met een .json-back-up.');
            }
        }

        function downloadBackup() {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
            link.download = 'cv-gegevens.json';
            document.body.appendChild(link);
            link.click();
            link.remove();
        }


        /* ---------- 10. PDF downloaden ---------- */

        function addFullResolutionPhoto(pdf, clone) {
            const photo = clone.querySelector('.photo');
            if (!photo || !data.photo) return;

            const cloneRect = clone.getBoundingClientRect();
            const photoRect = photo.getBoundingClientRect();
            const style = getComputedStyle(photo);
            const borderLeft = parseFloat(style.borderLeftWidth) || 0;
            const borderRight = parseFloat(style.borderRightWidth) || 0;
            const borderTop = parseFloat(style.borderTopWidth) || 0;
            const borderBottom = parseFloat(style.borderBottomWidth) || 0;
            const scale = pdf.internal.pageSize.getWidth() / cloneRect.width;
            const x = (photoRect.left - cloneRect.left + borderLeft) * scale;
            const y = (photoRect.top - cloneRect.top + borderTop) * scale;
            const width = (photoRect.width - borderLeft - borderRight) * scale;
            const height = (photoRect.height - borderTop - borderBottom) * scale;

            const points = pdf.internal.scaleFactor;
            const pageHeight = pdf.internal.pageSize.getHeight() * points;
            const centerX = (x + width / 2) * points;
            const centerY = pageHeight - (y + height / 2) * points;
            const radius = Math.min(width, height) * points / 2;
            const control = radius * 0.5522847498;
            const pdfY = (value) => pageHeight - value * points;

            pdf.setPage(1);
            pdf.saveGraphicsState();
            pdf.internal.write(
                `${centerX} ${pdfY(y)} m `
                + `${centerX + control} ${pdfY(y)} ${centerX + radius} ${centerY + control} ${centerX + radius} ${centerY} c `
                + `${centerX + radius} ${centerY - control} ${centerX + control} ${pdfY(y + height)} ${centerX} ${pdfY(y + height)} c `
                + `${centerX - control} ${pdfY(y + height)} ${centerX - radius} ${centerY - control} ${centerX - radius} ${centerY} c `
                + `${centerX - radius} ${centerY + control} ${centerX - control} ${pdfY(y)} ${centerX} ${pdfY(y)} c h W n`
            );
            pdf.addImage(data.photo, x, y, width, height);
            pdf.restoreGraphicsState();
        }

        async function downloadPdf() {
            const button = $('#btn-download');

            // Geen internet = geen PDF-bibliotheek. Dan gebruiken we het printvenster.
            if (typeof html2pdf === 'undefined') {
                alert('De PDF-bibliotheek kon niet laden (geen internet?). '
                    + 'Het printvenster wordt geopend: kies daar "Opslaan als PDF".');
                window.print();
                return;
            }

            button.disabled = true;
            button.textContent = 'PDF maken…';

            // We maken een kopie van het CV op volledige grootte, buiten beeld.
            // Zo heeft het verkleinde voorbeeld geen invloed op de PDF.
            const pages = data.onePage ? 1 : countPages(dom.cv.offsetHeight);
            const clone = dom.cv.cloneNode(true);
            if (data.onePage) {
                clone.style.cssText += `;height:${PDF_ONE_PAGE_HEIGHT_PX}px;min-height:0;overflow:hidden`;
            } else {
                clone.style.minHeight = `${pages * 297}mm`;
            }

            const offscreen = document.createElement('div');
            offscreen.style.cssText = 'position:fixed;left:-10000px;top:0;width:210mm';
            offscreen.appendChild(clone);
            document.body.appendChild(offscreen);

            try {
                await document.fonts.ready;

                // Bestandsnaam: alleen tekens weghalen die in bestandsnamen niet mogen
                const safeName = (data.name || 'naamloos').replace(/[\\/:*?"<>|]/g, '');

                const options = {
                    margin: 0,
                    filename: `CV - ${safeName}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 4, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                    pagebreak: data.onePage
                        ? { mode: [] }
                        : { mode: ['css', 'legacy'], avoid: ['.job', '.edu'] },
                };

                await html2pdf()
                    .set(options)
                    .from(clone)
                    .toPdf()
                    .get('pdf')
                    .then((pdf) => {
                        // Zorg dat er bij "één pagina" echt maar één pagina overblijft
                        if (data.onePage) {
                            while (pdf.internal.getNumberOfPages() > 1) {
                                pdf.deletePage(pdf.internal.getNumberOfPages());
                            }
                        }
                        addFullResolutionPhoto(pdf, clone);
                        // Stop de gegevens in de PDF zodat je hem later weer kunt openen
                        pdf.setProperties({
                            title: `CV - ${data.name || ''}`,
                            subject: 'Gemaakt met CV-maker',
                            keywords: PDF_DATA_MARKER + packData(),
                        });
                    })
                    .save();
            } catch (error) {
                console.error(error);
                alert('PDF maken is mislukt. Probeer de knop "Print / selecteerbare PDF".');
            }

            offscreen.remove();
            button.disabled = false;
            button.textContent = 'Download als PDF';
        }


        /* ---------- 11. Knoppen en invoer koppelen ---------- */

        /** Tekst die wordt ingetypt in het formulier (ook keuzelijsten). */
        function handleInput(event) {
            const target = event.target;

            if (target.dataset.list) {
                // Veld van een functie of opleiding
                data[target.dataset.list][Number(target.dataset.index)][target.dataset.field] = target.value;
            } else if (target.dataset.key) {
                // Gewoon veld
                data[target.dataset.key] = target.value;
            } else {
                return;
            }
            update();
        }

        /** Vinkje, eigen kleur en foto-upload. */
        function handleChange(event) {
            const target = event.target;

            if (target.id === 'option-one-page') {
                data.onePage = target.checked;
                update();
            } else if (target.id === 'option-custom-color') {
                data.color = target.value;
                updateAll();
            } else if (target.id === 'photo-input' && target.files[0]) {
                handlePhotoUpload(target.files[0]);
            }
        }

        /** Alle knoppen in het formulier. */
        function handleClick(event) {
            const button = event.target.closest('button');
            if (!button) return;

            if (button.dataset.color) {
                data.color = button.dataset.color;
                updateAll();
                return;
            }

            if (button.id === 'btn-remove-photo') {
                data.photo = '';
                updateAll();
                return;
            }

            // Functies en opleidingen: toevoegen, verwijderen, verplaatsen
            const action = button.dataset.action;
            if (!action) return;

            const items = data[button.dataset.list];
            const index = Number(button.dataset.index);

            if (action === 'add') {
                items.push({ ...NEW_ITEM[button.dataset.list] });
            } else if (action === 'delete') {
                items.splice(index, 1);
            } else if (action === 'up' && index > 0) {
                [items[index - 1], items[index]] = [items[index], items[index - 1]];
            } else if (action === 'down' && index < items.length - 1) {
                [items[index + 1], items[index]] = [items[index], items[index + 1]];
            }
            updateAll();
        }

        function setupEvents() {
            dom.editor.addEventListener('input', handleInput);
            dom.editor.addEventListener('change', handleChange);
            dom.editor.addEventListener('click', handleClick);

            $('#btn-download').addEventListener('click', downloadPdf);
            $('#btn-print').addEventListener('click', () => window.print());
            $('#btn-backup').addEventListener('click', downloadBackup);

            $('#btn-open').addEventListener('click', () => $('#file-open').click());
            $('#file-open').addEventListener('change', (event) => {
                const file = event.target.files[0];
                event.target.value = '';      // zodat je hetzelfde bestand opnieuw kunt kiezen
                if (file) openDataFile(file);
            });

            $('#btn-reset').addEventListener('click', () => {
                if (confirm('Alle invoer vervangen door het voorbeeld?')) {
                    data = structuredClone(SAMPLE_DATA);
                    updateAll();
                }
            });

            window.addEventListener('resize', updatePreviewScale);
            if (document.fonts) document.fonts.ready.then(() => renderCv());
        }


        /* ---------- 12. Starten ---------- */
        setupEvents();
        renderForm();
        renderCv();
        squareExistingPhoto();
    </script>
</body>

</html>
